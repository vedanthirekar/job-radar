name: Sponsor data

on:
  push:
    branches: [main]
    paths: [sponsors.py]
  schedule:
    - cron: "23 10 3 * *"   # 3rd of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companies
  cancel-in-progress: false

jobs:
  sponsors:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q python-calamine openpyxl
      - name: Build sponsor list from DOL H-1B filings
        run: python sponsors.py
      - name: Save sponsor list
        run: scripts/commit.sh "sponsors refresh DOL data" data/sponsors.csv data/sponsor_candidates.txt
      - name: Add sponsoring companies to the watch list
        run: |
          git pull -q --rebase origin main
          python detect.py
      - name: Save companies
        run: scripts/commit.sh "detect add sponsoring companies" companies.csv data/probed.json
